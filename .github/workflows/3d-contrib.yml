name: 3D Contribution Calendar

on:
  schedule:
    # Runs daily at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab
  # NOTE: no "push" trigger on purpose — it would commit regenerated SVGs to main
  # on every push and create commit churn. Runs on schedule / manual only.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: regenerate 3D contribution calendar"; then
            git push
          fi
